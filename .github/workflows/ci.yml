name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck + Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build dist
        run: bun run build

      - name: Verify dist exists
        run: ls -la dist/index.js dist/index.d.ts

  showcase:
    name: Multi-Adapter Showcase (Postgres + MySQL + MSSQL)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: squn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: squn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Password123!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1' -C -b"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30

    steps:
      # Checkout squn and squn-test-app as siblings so tsconfig path alias
      # "squn": ["../squn/src/index.ts"] resolves correctly from squn-test-app.
      - uses: actions/checkout@v4
        with:
          path: work/squn

      - uses: actions/checkout@v4
        with:
          repository: phonemyatt/squn-test-app
          path: work/squn-test-app

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install squn deps
        working-directory: work/squn
        run: bun install

      - name: Install squn-test-app deps
        working-directory: work/squn-test-app
        run: bun install

      # Bun's MySQL client doesn't support caching_sha2_password (MySQL 8 default).
      # Switch root to mysql_native_password before the showcase runs.
      - name: Configure MySQL native password
        run: |
          mysql -u root -ppassword -h 127.0.0.1 -P 3306 --protocol=TCP -e \
            "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'password'; FLUSH PRIVILEGES;"

      - name: Run showcase
        working-directory: work/squn-test-app
        env:
          SKIP_DOCKER: "1"
          PG_URL: postgresql://postgres:password@localhost:5432/squn_test
          MYSQL_URL: mysql://root:password@localhost:3306/squn_test
          MSSQL_HOST: localhost
          MSSQL_PORT: "1433"
          MSSQL_DB: master
          MSSQL_USER: sa
          MSSQL_PASSWORD: "Password123!"
        run: bun run showcase:all

